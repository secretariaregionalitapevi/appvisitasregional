{% extends 'base.html' %}

{% load static %}

{% block title %}Página não encontrada{% endblock %}

{% block outter_content %}
	<!-- BEGIN error -->
	<div class="error">
		<div class="error-code">404</div>
		<div class="error-content">
			<div class="error-message">Página não encontrada</div>
			<div class="error-desc mb-4">
				A página que você procura não existe ou foi movida. <br />
				Verifique o endereço ou volte à página inicial.
			</div>
			<div>
				<a href="/" class="btn btn-success px-3">Voltar ao início</a>
			</div>
		</div>
	</div>
	<!-- END error -->
{% endblock %}
