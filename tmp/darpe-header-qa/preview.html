<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1e3a8a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>Atendimentos | CCB DARPE</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-180.png"><link rel="icon" href="/assets/favicon.png"><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --brand: #1e3a8a; /* Premium Dark Blue */
  --brand-light: #3b82f6; /* Premium Blue */
  --brand-dark: #1e3a8a; /* Keeping it dark */
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --surface: #ffffff;
  --soft: #f8fafc;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.15);
  --glass-bg: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(255, 255, 255, 0.3);
}

* {
  box-sizing: border-box;
}

html {
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  background: #f1f5f9;
  -webkit-font-smoothing: antialiased;
}

body {
  margin: 0;
}

.mobile-body {
  min-height: 100vh;
  background: radial-gradient(circle at top right, #e0e7ff 0%, #f1f5f9 40%, #f8fafc 100%);
  background-attachment: fixed;
}

button, input, select, textarea {
  font: inherit;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: max(16px, env(safe-area-inset-top)) 24px 16px;
  background: var(--glass-bg);
  border-bottom: 1px solid var(--glass-border);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
}

.brand-mark {
  display: flex;
  align-items: center;
  gap: 14px;
}

.header-logo {
  height: 42px;
  width: auto;
  flex-shrink: 0;
  object-fit: contain;
}

.header-titles strong {
  display: block;
  font-size: 17px;
  font-weight: 800;
  color: var(--brand-dark);
  line-height: 1.2;
}

.header-titles span {
  display: block;
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.header-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 16px;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 700;
  text-decoration: none;
  height: 38px;
  white-space: nowrap;
  transition: all 0.2s ease;
}

.header-btn.btn-back {
  background: #ffffff;
  color: #1e3a8a;
  border: 1px solid #e2e8f0;
}

.header-btn.btn-exit {
  background: #1e3a8a;
  color: #ffffff;
  border: 1px solid #1e3a8a;
}

.app-main {
  width: min(760px, 100%);
  margin: auto;
  padding: 24px 20px calc(190px + env(safe-area-inset-bottom));
}

.welcome-card {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 28px;
  border-radius: 24px;
  background: linear-gradient(135deg, #1e3a8a, #3b82f6);
  color: #fff;
  box-shadow: var(--shadow);
  position: relative;
  overflow: visible;
  z-index: 10;
}

.welcome-card::after {
  content: '';
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  border-radius: 24px;
  background: linear-gradient(220deg, rgba(255,255,255,0.15) 0%, transparent 60%);
  pointer-events: none;
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.15em;
  opacity: 0.85;
  text-transform: uppercase;
}

.welcome-card h1 {
  margin: 8px 0 6px;
  font-size: 28px;
  letter-spacing: -0.02em;
}

.welcome-card p {
  margin: 0;
  font-size: 14px;
  opacity: 0.9;
  font-weight: 500;
}

.date-control {
  align-self: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  z-index: 1;
}

.date-control input {
  max-width: 155px;
  padding: 10px 14px;
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(8px);
  color: #fff;
  font-weight: 600;
  outline: none;
  transition: all 0.2s ease;
}

.date-control input:focus {
  background: rgba(255,255,255,0.25);
  border-color: rgba(255,255,255,0.8);
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin: 24px 0 32px;
}

.summary-grid article {
  display: flex;
  flex-direction: column;
  padding: 20px;
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.5);
  transition: transform 0.2s ease;
}

.summary-grid article:hover {
  transform: translateY(-2px);
}

.summary-grid strong {
  font-size: 28px;
  color: var(--brand);
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 4px;
}

.summary-grid span {
  font-size: 12px;
  color: var(--muted);
  font-weight: 600;
}

.section-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 16px;
}

.section-heading h2 {
  margin: 4px 0 0;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--ink);
}

.text-button {
  border: 0;
  background: transparent;
  color: var(--brand-light);
  font-weight: 700;
  cursor: pointer;
  padding: 6px 12px;
  border-radius: 8px;
  transition: background 0.2s;
}

.text-button:hover {
  background: rgba(59, 130, 246, 0.1);
}

.state-card {
  padding: 32px;
  border: 2px dashed #cbd5e1;
  border-radius: 20px;
  text-align: center;
  color: var(--muted);
  font-weight: 500;
  background: rgba(255,255,255,0.6);
}

.visit-list {
  display: grid;
  gap: 14px;
}

.visit-kanban {
  display: block;
  width: 100%;
}

.kanban-lane {
  display: block;
  width: 100%;
  min-width: 0;
  margin: 0 0 22px;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 18px;
  background: transparent;
  transition: border-color 0.18s ease, background-color 0.18s ease, transform 0.18s ease;
}

.kanban-lane-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 4px 10px;
  color: #1e3a5f;
  font-size: 15px;
  font-weight: 800;
}

.kanban-lane-header strong {
  display: grid;
  place-items: center;
  min-width: 28px;
  height: 28px;
  padding: 0 7px;
  border-radius: 999px;
  background: #dbeafe;
  color: #2563eb;
  font-size: 12px;
}

.kanban-lane-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-height: 72px; }
.kanban-lane.is-drop-target { border-color: #3b82f6; background: #eaf2ff; transform: scale(1.01); }
.kanban-empty {
  display: grid;
  place-items: center;
  min-height: 68px;
  padding: 14px;
  border: 2px dashed #bfdbfe;
  border-radius: 16px;
  color: #64748b;
  text-align: center;
  font-size: 12px;
  font-weight: 700;
}

.kanban-drag-handle {
  display: grid;
  place-items: center;
  flex: 0 0 28px;
  width: 28px;
  min-width: 28px;
  min-height: 44px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: #eff6ff;
  color: #3b82f6;
  font-size: 21px;
  line-height: 1;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.kanban-drag-handle:active { cursor: grabbing; background: #dbeafe; }
.visit-card.is-locked { cursor: pointer; }
.visit-card.is-dragging { opacity: 0.55; transform: scale(0.98); box-shadow: 0 14px 34px rgba(37, 99, 235, 0.18); }
.kanban-drag-active { overscroll-behavior: none; }

@media (max-width: 760px) {
  .kanban-lane { padding: 0; }
  .kanban-lane-body { min-height: 76px; }
}

.visit-card {
  width: 100%;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  background: var(--surface);
  text-align: left;
  color: var(--ink);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.03);
  cursor: pointer;
  transition: all 0.2s ease;
  flex-wrap: wrap;
}

.visit-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
}

.visit-swipe-shell {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 24px;
  background: #dc2626;
}

.visit-swipe-shell .visit-card {
  position: relative;
  z-index: 1;
  margin: 0;
}

.visit-card.can-swipe-delete {
  touch-action: pan-y;
  will-change: transform;
  user-select: none;
  -webkit-user-select: none;
}

.visit-card.can-swipe-delete.is-swiping {
  transition: none;
  cursor: grabbing;
  box-shadow: -8px 0 22px rgba(127, 29, 29, 0.16);
}

.visit-swipe-delete {
  position: absolute;
  z-index: 0;
  inset: 0 auto 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 5px;
  width: 104px;
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  opacity: 0.35;
  transform: scale(0.86);
  transition: opacity 0.16s ease, transform 0.16s ease;
  pointer-events: none;
}

.visit-swipe-shell.is-swipe-active .visit-swipe-delete {
  opacity: 1;
  transform: scale(1);
}

.visit-swipe-delete svg {
  width: 25px;
  height: 25px;
}

.visit-swipe-shell.is-deleting {
  opacity: 0.55;
  pointer-events: none;
}

.route-number {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: #eff6ff;
  color: var(--brand-light);
  font-weight: 800;
  font-size: 16px;
  flex-shrink: 0;
}

.visit-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.visit-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 16px;
  font-weight: 700;
  color: #0f172a;
}

.category-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
  white-space: nowrap;
  flex-shrink: 0;
}

.team-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  padding: 3px 9px;
  border: 1px solid #c4b5fd;
  border-radius: 999px;
  background: #f3efff;
  color: #5b21b6;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: .02em;
  overflow-wrap: anywhere;
}

.team-badge svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.team-badge-unassigned {
  border-color: #cbd5e1;
  background: #f1f5f9;
  color: #475569;
}

.cat-gvi { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
.cat-gvm { background: #ccfbf1; color: #0d9488; border: 1px solid #99f6e4; }
.cat-gve { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
.cat-rf  { background: #f3e8ff; color: #7c3aed; border: 1px solid #e9d5ff; }
.cat-re  { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
.cat-default { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }

.visit-address {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #64748b;
  font-size: 13px;
  font-weight: 500;
}

.visit-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  white-space: nowrap;
  font-size: 13px;
  color: #475569;
  font-weight: 700;
}

.visit-meta b {
  flex-shrink: 0;
}

.visit-meta span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}

.visit-tags {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  min-height: 18px;
}

.visit-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.action-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  transition: transform 0.15s ease;
}

.action-icon:hover {
  transform: scale(1.08);
}

.action-icon svg {
  display: block;
}

.status-pill {
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  flex-shrink: 0;
}

.status-pill.done { background: #dcfce7; color: var(--success); }
.status-pill.cancel, .status-pill.missed { background: #fee2e2; color: var(--danger); }
.status-pill.pending { background: #dbeafe; color: var(--brand-light); }

.chevron {
  color: #cbd5e1;
  font-size: 24px;
  flex-shrink: 0;
  margin-left: 4px;
  transition: transform 0.2s;
}

.visit-card:hover .chevron {
  transform: translateX(4px);
  color: var(--brand-light);
}

/* Float Buttons */
.fab-container {
  position: fixed;
  right: 24px;
  bottom: max(24px, env(safe-area-inset-bottom));
  z-index: 15;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.floating-button {
  border: 0;
  border-radius: 999px;
  padding: 16px 24px;
  background: var(--brand);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 10px 25px rgba(30, 58, 138, 0.4);
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

.floating-button:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 30px rgba(30, 58, 138, 0.5);
  background: var(--brand-light);
}

.floating-button.secondary {
  background: #fff;
  color: var(--brand);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}
.floating-button.secondary:hover {
  background: var(--soft);
}

.app-dialog {
  width: min(620px, calc(100% - 32px));
  max-height: 90vh;
  padding: 0;
  border: 0;
  border-radius: 28px;
  box-shadow: 0 35px 80px rgba(0, 0, 0, 0.3);
  background: var(--surface);
}

.app-dialog::backdrop {
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.dialog-content {
  padding: 28px;
  overflow: auto;
}

.dialog-head {
  display: flex;
  justify-content: space-between;
  gap: 16px;
}

.dialog-head h2 {
  margin: 6px 0 0;
  font-size: 24px;
  letter-spacing: -0.02em;
}

.dialog-head button {
  border: 0;
  background: var(--soft);
  color: var(--muted);
  border-radius: 50%;
  width: 42px;
  height: 42px;
  font-size: 26px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.dialog-head button:hover {
  background: #e2e8f0;
  color: var(--ink);
}

.address-line, .helper {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  font-weight: 500;
}

.dialog-content label, .stack-form label {
  display: grid;
  gap: 8px;
  margin-top: 18px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}

.visit-time-wrap {
  margin-top: 18px;
}

.visit-time-title {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}

.visit-time-title small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
}

.visit-time-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.visit-duration {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  background: #dbeafe;
  color: #1d4ed8;
  font-weight: 800;
}

.visit-duration-exceeded {
  color: #dc2626 !important;
  background: #fee2e2;
  border-radius: 6px;
  padding: 2px 5px;
  font-weight: 800;
}

.dialog-content .visit-time-grid label {
  margin-top: 8px;
}

.dialog-content input, .dialog-content select, .dialog-content textarea, .stack-form input {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: var(--soft);
  color: var(--ink);
  transition: all 0.2s ease;
}

.dialog-content input:focus, .dialog-content select:focus, .dialog-content textarea:focus {
  outline: none;
  border-color: var(--brand-light);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
}

.status-options {
  display: grid;
  gap: 10px;
  margin: 22px 0 0;
  padding: 0;
  border: 0;
}

.status-options legend {
  margin-bottom: 10px;
  font-size: 13px;
  font-weight: 700;
}

.status-options label {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0;
  padding: 14px;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.2s;
}

.status-options label:hover {
  background: var(--soft);
  border-color: #cbd5e1;
}

.status-options input:checked + span + text {
  font-weight: 800;
}

.status-options input {
  width: auto;
  transform: scale(1.2);
}

.status-options span {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  font-size: 14px;
  font-weight: 800;
  transition: all 0.2s ease;
}

.status-done span {
  background: #dbeafe;
  color: #2563eb;
}

.status-cancel span {
  background: #fee2e2;
  color: #dc2626;
}

.status-missed span {
  background: #ffedd5;
  color: #ea580c;
}

.status-options label.status-done:has(input:checked) {
  border-color: #2563eb;
  background: #f0f7ff;
}

.status-options label.status-done input:checked + span {
  background: #2563eb;
  color: #ffffff;
}

.status-options label.status-cancel:has(input:checked) {
  border-color: #dc2626;
  background: #fff5f5;
}

.status-options label.status-cancel input:checked + span {
  background: #dc2626;
  color: #ffffff;
}

.status-options label.status-missed:has(input:checked) {
  border-color: #ea580c;
  background: #fff7ed;
}

.status-options label.status-missed input:checked + span {
  background: #ea580c;
  color: #ffffff;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0 16px;
}

.form-grid .full {
  grid-column: 1 / -1;
}

.optional-visit-card {
  margin-top: 18px;
  padding: 6px;
  border: 1px solid #dbe5f2;
  border-radius: 18px;
  background: #f8fbff;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

.optional-visit-card.is-active {
  border-color: #93c5fd;
  background: #f7fbff;
  box-shadow: 0 10px 28px rgba(37, 99, 235, 0.09);
}

.dialog-content .optional-visit-toggle {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 72px;
  margin: 0;
  padding: 12px 14px;
  cursor: pointer;
}

.optional-visit-toggle input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.optional-visit-copy {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.optional-visit-copy > span:last-child,
.optional-visit-toggle small {
  display: block;
}

.optional-visit-icon {
  display: grid;
  place-items: center;
  flex: 0 0 42px;
  width: 42px;
